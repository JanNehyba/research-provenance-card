name: Validate RPC

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Validate registry cards
        run: |
          python tools/validate.py "registry/**/*.json" || if ls registry/**/*.json 1> /dev/null 2>&1; then exit 1; else echo "No registry cards yet"; fi
